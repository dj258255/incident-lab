# B43 expand-contract 재현 환경. 이 문제의 무대는 PostgreSQL의 락 관리자라 DB 하나면 충분하다.
# 컨테이너 이름은 b43 접두어로 다른 세션과 겹치지 않게 했고, 호스트 포트는 게시하지 않는다.
# 러너가 같은 이미지의 psql로 여러 세션을 동시에 띄워 락 대기 사슬을 만든다.
# 실행: docker compose up --abort-on-container-exit
services:
  db:
    image: postgres:16-alpine
    container_name: lab-b43-pg
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    command:
      - postgres
      # 락 대기가 deadlock_timeout(기본 1초)을 넘기면 서버가 직접 기록한다.
      # 클라이언트가 잰 시간과 서버가 기록한 시간을 대조하려고 켠다.
      - -c
      - log_lock_waits=on
      - -c
      - log_line_prefix=%m [%p] %a
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  runner:
    image: postgres:16-alpine
    container_name: lab-b43-runner
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: lab
      PGPASSWORD: lab
      PGDATABASE: lab
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/run.sh"]
