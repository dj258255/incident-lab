# R14 재현 환경
# 성능 측정이 아니라 동작 재현이라 자원 상한은 걸지 않는다. 이 세션에는 시간 수치가 없다.
# 이 이미지는 타임존 테이블이 이미 적재된 채로 온다(time_zone_name 1,792행).
# 미적재 상태는 기본값이 아니라 run-experiments.sh가 TRUNCATE로 만드는 상태다.
services:
  mysql:
    image: mysql:8.4.3
    container_name: r14-mysql
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: spoon
    ports: ["13309:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 3s
      timeout: 3s
      retries: 30
