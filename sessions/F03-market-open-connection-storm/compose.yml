# 재현 환경. Postgres 위에 MTS 시세 조회 앱을 올린다.
# 부하는 별도 k6 컨테이너로 이 네트워크에 붙여 준다(reproduce.md 참고).
services:
  db:
    image: postgres:16-alpine
    container_name: lab-f03-db
    environment:
      POSTGRES_DB: mts
      POSTGRES_USER: mts
      POSTGRES_PASSWORD: mts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mts"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    container_name: lab-f03-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 계층별 몫을 가르는 조건에서만 바꾼다. 기본 200은 Spring Boot 기본값과 같다.
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      # 풀 크기를 바꿔 가며 재려고 밖으로 뺀다. 기본값은 application.properties 와 같은 10이다.
      # Spring Boot 의 완화 바인딩이 이 환경변수를 hikari.maximum-pool-size 로 읽는다.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${POOL_SIZE:-10}
      # 부하 차단 허용 수. 풀 크기와 같게 두는 것이 기본이라 함께 움직인다.
      MTS_SHED_PERMITS: ${SHED_PERMITS:-10}
    expose:
      - "8080"
    # 부하(k6)는 같은 compose 네트워크에서 app:8080으로 붙는다. 아래 18083은 부하 경로가 아니라
    # 기동 대기(/health)와 계측 회수(/stats)에만 쓰는 관측용 포트다.
    ports:
      - "127.0.0.1:18083:8080"
