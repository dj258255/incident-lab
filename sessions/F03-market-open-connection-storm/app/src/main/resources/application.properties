spring.main.banner-mode=off
server.port=8080

# --- 데이터소스 (Postgres) ---
spring.datasource.url=jdbc:postgresql://db:5432/mts
spring.datasource.username=mts
spring.datasource.password=mts

# --- HikariCP: 장 시작 급증을 견디지 못하는 작은 풀 ---
# 조회 쿼리가 커넥션을 약 50ms 점유하므로 풀 10으로는 초당 약 200건이 한계다.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.pool-name=quote-pool

# --- 부하 차단(load shedding) 동시 허용 수. 풀 크기와 같게 두어 받은 요청의 지연을 지킨다. ---
# 허용된 요청은 커넥션을 곧바로 잡아 빠르게 처리하고, 초과분은 대기 없이 503으로 흘려보낸다.
# 이 값을 풀보다 크게 잡으면 처리량은 늘지만 받은 요청의 지연이 올라간다(README 6절 참고).
mts.shed.permits=10

# --- 톰캣: 스파이크 시 커넥션이 accept 단계에서 거부되지 않도록 백로그를 넓힌다. ---
# accept-count는 커널 listen 백로그다. 넓혀 두면 스파이크 초반에 connection refused가 나지 않는다.
# 다만 이 값이 앱이 동시에 붙들 수 있는 요청 수를 정하지는 않는다. 소켓을 붙들고 있는 것은
# max-connections(기본 8192)이고, 실측에서 열린 소켓이 4,995개까지 올라갔다(results/thread-sweep.txt).
server.tomcat.accept-count=1000
# 스레드 최대는 Spring Boot 기본값과 같은 200이다. 계층별 몫을 가르는 조건에서만
# TOMCAT_MAX_THREADS 환경변수로 바꿔 돌린다(README 3절).
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}

# --- 스키마·시드 초기화 ---
spring.sql.init.mode=always

logging.level.com.zaxxer.hikari=INFO
logging.level.org.apache.catalina=WARN
