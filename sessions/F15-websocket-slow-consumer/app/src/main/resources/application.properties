spring.main.banner-mode=off
server.port=8080

# --- 재현 조건 (compose에서 환경변수로 덮어쓴다) ---
# 모드: direct | unbounded | bounded | conflate | terminate | combo | decorator
stream.mode=${STREAM_MODE:direct}
stream.tick-rate=${STREAM_TICK_RATE:3000}
stream.symbols=${STREAM_SYMBOLS:20}
stream.payload-bytes=${STREAM_PAYLOAD_BYTES:480}
stream.expect-clients=${STREAM_EXPECT_CLIENTS:6}
stream.queue-capacity=${STREAM_QUEUE_CAPACITY:1000}
stream.buffer-limit-bytes=${STREAM_BUFFER_LIMIT_BYTES:524288}
stream.send-time-limit-ms=${STREAM_SEND_TIME_LIMIT_MS:5000}
stream.over-limit-seconds=${STREAM_OVER_LIMIT_SECONDS:3}
stream.pool-threads=${STREAM_POOL_THREADS:4}
stream.blocking-send-timeout-ms=${STREAM_BLOCKING_SEND_TIMEOUT_MS:0}
stream.sample-file=${STREAM_SAMPLE_FILE:/results/server.csv}
stream.label=${STREAM_LABEL:run}

# --- WebSocket 프레임 크기. 틱 하나가 작아서 기본값으로 충분하다. ---
server.tomcat.max-http-form-post-size=-1

logging.level.org.apache.catalina=WARN
logging.level.org.springframework.web.socket=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %msg%n
