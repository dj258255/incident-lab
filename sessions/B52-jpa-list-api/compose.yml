# B52 재현 환경
# JPA 목록 API의 세 가지 함정을 Spring Boot 앱으로 재현한다.
services:
  mysql:
    image: mysql:8.4.3
    container_name: b52-mysql
    cpus: 4
    mem_limit: 2g
    command:
      - --innodb-buffer-pool-size=1G
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.2
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: spoon
    ports: ["13314:3306"]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 3s
      timeout: 3s
      retries: 30

  # PostgreSQL 대조. 행값 비교 (created_at, id) > (?, ?) 에 범위 최적화가
  # 걸리는지가 이 대조의 질문이다. MySQL 8.4.3 은 걸지 않는다.
  postgres:
    image: postgres:17.5
    container_name: b52-pg
    cpus: 4
    mem_limit: 2g
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=2GB
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: spoon
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["15440:5432"]
