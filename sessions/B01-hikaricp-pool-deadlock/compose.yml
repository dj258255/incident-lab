# B01 재현 환경
# 커넥션 풀 데드락은 DB 성능 문제가 아니라 자원 배분 문제라, DB는 넉넉하게 둔다.
# 풀이 마르는 것이지 DB가 느린 것이 아님을 분리하기 위해서다.
services:
  mysql:
    image: mysql:8.4.3
    container_name: b01-mysql
    command:
      - --max-connections=500
      - --innodb-buffer-pool-size=512M
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: spoon
    ports: ["13319:3306"]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [lab]
    # 자원 한도를 두지 않았습니다. 이 세션의 병목은 커넥션 풀이지 CPU가 아니고,
    # 1회차 측정을 한도 없이 했기 때문에 회차 비교를 위해 그대로 둡니다.
    # 그래서 절대 처리량은 이 호스트(12코어) 값이고 다른 세션과 비교하면 안 됩니다.
    # run.sh가 띄우는 앱 컨테이너에도 한도가 없습니다.
    healthcheck:
      # mysqladmin ping은 초기화 중 임시 서버에도, 인증 실패에도 성공을 반환합니다.
      # 대상 DB에 실제 쿼리가 통하는지로 판정해야 조용히 지나가지 않습니다.
      test: ["CMD-SHELL", "mysql -uroot -plab spoon -N -e 'SELECT 1' | grep -q 1"]
      interval: 3s
      timeout: 3s
      retries: 30

networks:
  lab:
    name: b01-lab
