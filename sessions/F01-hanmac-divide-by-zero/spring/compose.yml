# 실제 스택 재현. docker compose up 한 번으로 Spring Boot 앱이 뜨고,
# 내장 드라이버가 자기 REST API로 주문 120건을 쏜 뒤 집계를 출력하고 종료한다.
# 드라이버는 컨테이너 안에서 localhost:8080으로 호출하므로 아래 매핑은 사람이 직접
# curl 해 볼 때만 쓴다. 호스트 8080이 흔히 점유돼 있어 18080으로 내보낸다.
services:
  app:
    build: .
    container_name: lab-f01-hanmac-spring
    ports:
      - "18080:8080"
