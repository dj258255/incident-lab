# R16 재현 환경
# 배치성 풀 스캔이 InnoDB 버퍼 풀에서 OLTP 워킹셋을 밀어내는 조건을 만든다.
# 핵심은 "콜드 테이블 > 버퍼 풀 > 핫 테이블" 크기 관계다. 버퍼 풀이 데이터보다 크면 오염이 성립하지 않는다.
services:
  mysql:
    image: mysql:8.4.3
    container_name: r16-mysql
    cpus: 4
    mem_limit: 2g
    command:
      - --innodb-buffer-pool-size=1G
      - --max-connections=200
      - --innodb-flush-log-at-trx-commit=1
      - --performance-schema=ON
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: spoon
    ports: ["13308:3306"]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 3s
      timeout: 3s
      retries: 30
