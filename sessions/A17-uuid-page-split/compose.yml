# A17 재현 환경
# PK를 무엇으로 잡느냐만 바꾸고 같은 행을 같은 수만큼 넣는다.
#
# 버퍼 풀을 256M로 작게 고정한 것이 이 세션의 핵심 조건이다. 인덱스가 버퍼 풀보다 커야
# 랜덤 PK의 대가가 드러난다. 순차 PK는 항상 오른쪽 끝 페이지에만 쓰므로 그 한 장이 캐시에
# 남아 있으면 되고, 랜덤 PK는 매번 다른 페이지를 골라 쓰기 때문에 그 페이지를 디스크에서
# 읽어 온 뒤에 고쳐야 한다. 버퍼 풀이 인덱스 전체를 담을 만큼 크면 이 차이가 사라진다.
services:
  mysql:
    image: mysql:8.4.3
    container_name: a17-mysql
    cpus: 2
    mem_limit: 2g
    command:
      - --innodb-buffer-pool-size=256M
      - --innodb-buffer-pool-instances=1
      # A08에서 확인한 대로, 이걸 끄지 않으면 앞 조건의 워킹셋을 물려받는다.
      - --innodb-buffer-pool-dump-at-shutdown=OFF
      - --innodb-buffer-pool-load-at-startup=OFF
      # 페이지 읽기가 진짜 디스크로 가야 조건 간 차이가 지연에 나타난다.
      # A08 실험 3에서 이걸 안 켜면 호스트 페이지 캐시가 다 받아 준다는 것을 실측했다.
      - --innodb-flush-method=O_DIRECT
      - --skip-log-bin
      - --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: lab
    ports: ["13310:3306"]
    volumes:
      - a17-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 3s
      timeout: 3s
      retries: 40

  load:
    build: ./scripts
    image: a17-load
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./scripts:/app:ro
      - ./results:/results
    working_dir: /app
    environment:
      MYSQL_HOST: mysql

volumes:
  a17-data:
