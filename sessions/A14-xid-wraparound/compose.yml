# A14 재현 환경
# 트랜잭션 ID wraparound에 실제로 도달해, 경고와 읽기 전용 전환과 복구를 관측한다.
#
# 32비트 XID는 21억 개다. 초당 5만 개를 소비해도 정지 지점까지 12시간이 걸리므로
# 부하만으로는 못 간다. 그래서 pg_resetwal -x로 XID 카운터를 앞으로 점프시킨다.
# 점프는 카운터만 옮기고 datfrozenxid는 그대로 두므로 age(datfrozenxid)가 커진다.
# 실제 사고에서 벌어지는 것과 같은 상태다.
#
# 컨테이너를 멈추고 pg_resetwal을 돌려야 하므로 데이터는 이름 있는 볼륨에 둔다.
services:
  postgres:
    image: postgres:17.5
    container_name: a14-pg
    cpus: 4
    mem_limit: 2g
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      # 자동 청소가 끼어들면 age가 내려가 버려 관측이 안 된다. 조건마다 켜고 끈다.
      - -c
      - autovacuum=${AUTOVACUUM:-on}
      # 기본값 2억. 최소 10만까지 내릴 수 있어 이 값으로 조기 발동을 관측한다.
      - -c
      # failsafe 실효 하한은 Max(vacuum_failsafe_age, autovacuum_freeze_max_age * 1.05) 다.
      # 기본값 2억에서는 하한이 2억 1천만이라 작은 테이블로 발동 조건을 만들 수 없다.
      # exp-failsafe.sh 는 FREEZE_MAX_AGE=100000 으로 띄워 하한을 105,000 으로 만든다.
      - autovacuum_freeze_max_age=${FREEZE_MAX_AGE:-200000000}
      # PG14에 추가된 안전장치. 기본 16억. 이 나이를 넘으면 인덱스 정리를 건너뛰고
      # 동결에만 집중한다. Sentry류 시나리오를 자동으로 완화하는 장치다.
      - -c
      - vacuum_failsafe_age=${FAILSAFE_AGE:-1600000000}
      # 버려진 prepared transaction이 vacuum의 동결을 막는 것이 이 세션의 원인이다.
      - -c
      - max_prepared_transactions=10
      - -c
      - log_min_messages=warning
      - -c
      - log_autovacuum_min_duration=0
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: spoon
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - a14data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    ports: ["15436:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  a14data:
