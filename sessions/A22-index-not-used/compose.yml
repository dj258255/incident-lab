# A22 재현 환경
# 인덱스는 있는데 옵티마이저가 쓰지 못하는 다섯 가지 조건을 재현한다.
# 성능 비교가 목적이라 자원을 고정하고, 버퍼 풀은 데이터가 다 들어갈 만큼 준다.
# (캐시 미스가 섞이면 "인덱스를 못 탄 비용"과 "디스크 비용"이 뒤엉킨다)
services:
  mysql:
    image: mysql:8.4.3
    container_name: a22-mysql
    # 재측정 호스트가 2코어라 4를 주면 도커가 거부한다.
    #   Error response from daemon: range of CPUs is from 0.01 to 2.00, as there are only 2 CPUs available
    # 처음 측정에 쓴 cpus: 4는 이 장비에서 애초에 뜰 수 없었다는 뜻이라, 그 실행은 다른 호스트였다.
    cpus: 2
    mem_limit: 4g
    command:
      - --innodb-buffer-pool-size=2G
      - --performance-schema=ON
      - --slow-query-log=ON
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.5
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: spoon
    ports: ["13313:3306"]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 3s
      timeout: 3s
      retries: 30

  # PostgreSQL 대조. 다섯 조건 가운데 둘은 아예 에러가 되고,
  # 나머지 셋에는 MySQL 에 없는 직접적인 해법(표현식 인덱스, pg_trgm)이 있다.
  postgres:
    image: postgres:17.5
    container_name: a22-pg
    cpus: 2
    mem_limit: 4g
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - max_wal_size=2GB
      - -c
      - track_io_timing=on
      # 계획이 왜 그렇게 나왔는지 보려면 통계가 최신이어야 한다.
      - -c
      - default_statistics_target=100
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: spoon
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["15439:5432"]
