# A18 재현 환경
# Uber 2016 글의 쓰기 증폭 주장을 PostgreSQL에서 조건별로 계측한다.
services:
  postgres:
    image: postgres:17.5
    container_name: a18-pg
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - wal_compression=off      # WAL 크기를 비교 지표로 쓰므로 압축을 꺼서 왜곡을 없앤다
                                 # 대신 모든 배수가 이 조건에서만 성립한다. 켜면 FPI가
                                 # 압축되는데 이 실험에서 FPI가 WAL의 1/3~2/3라 배수가 달라진다
# 기록하지 않은 것 (재측정 시 채울 것)
#  - autovacuum을 끄지 않았다. pg_current_wal_lsn()은 인스턴스 전역이라 앞 조건이 유발한
#    autovacuum WAL이 뒤 조건 측정에 섞였을 수 있다. 다시 잰다면 -c autovacuum=off 를 주고
#    조건마다 컨테이너를 새로 만들어야 한다. 지금 값을 만든 실행에는 이 옵션이 없었다.
#  - cpus, mem_limit 같은 컨테이너 자원 한도를 두지 않았다.
#  - 호스트 사양을 기록하지 않았다. 그래서 measure.csv의 elapsed_s는 같은 실행 안의
#    상대 비교로만 유효하고 다른 세션의 절대 시간과 비교하면 안 된다.
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: spoon
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
