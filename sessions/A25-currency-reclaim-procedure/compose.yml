# A25 재현 환경
# A24 가 뽑은 회수 대상을 실제로 되돌리는 보정 프로시저를 다룬다.
# 배치 크기와 커밋 간격은 A04 의 결론(승격은 테이블 락 6,250개, 배치는 5,000행 미만)을 따른다.
# 보정 자체를 되돌리려면 로그 백업 체인이 필요하므로 복구 모델은 FULL 로 둔다.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: a25-mssql
    cpus: 4
    mem_limit: 6g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Lab_Passw0rd!"
      MSSQL_PID: "Developer"
    ports: ["11436:1433"]
    volumes:
      - a25backup:/var/opt/mssql/backup

  # 복제로 이관하는 경우를 재려고 둔다. 본체(a25-mssql)는 안 건드린다.
  # 복제는 SQL Server 에이전트가 있어야 도는데 이 이미지는 기본으로 꺼져 있고,
  # 켜려면 환경변수를 주고 컨테이너를 다시 만들어야 한다. 본체를 다시 만들면
  # 데이터가 날아가므로 못 쓴다. **이것부터가 복제의 세팅 비용이다.**
  repl-pub:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: a25-repl-pub
    hostname: a25-repl-pub
    cpus: 2
    # 발행자가 배포자를 겸해 배포 DB 까지 든다. 2g 로는 internal 리소스 풀이
    # 모자라 "insufficient system memory" 로 죽었다.
    mem_limit: 4g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Lab_Passw0rd!"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
    ports: ["11439:1433"]

  repl-sub:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: a25-repl-sub
    hostname: a25-repl-sub
    cpus: 2
    mem_limit: 2g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Lab_Passw0rd!"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
    ports: ["11440:1433"]

volumes:
  a25backup:

