# R17 재현 환경
# 시계열 로그 테이블의 대량 삭제와 파티션 운영을 비교한다.
# R13과 같은 자원 상한(4 vCPU / 2GB)을 걸어 세션 간 수치를 비교할 수 있게 한다.
services:
  mysql:
    image: mysql:8.4.3
    container_name: r17-mysql
    cpus: 4
    mem_limit: 2g
    command:
      - --innodb-buffer-pool-size=1G
      - --max-connections=200
      - --innodb-flush-log-at-trx-commit=1
      - --performance-schema=ON
      # MDL 대기를 performance_schema.metadata_locks로 관측하려면 이 계측이 켜져 있어야 한다
      - --performance-schema-instrument=wait/lock/metadata/sql/mdl=ON
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: spoon
    ports: ["13307:3306"]
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 3s
      timeout: 3s
      retries: 30
