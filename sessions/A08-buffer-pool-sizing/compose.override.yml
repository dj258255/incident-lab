services:
  mysql:
    cpus: 2
    command:
      - --innodb-buffer-pool-size=${BP_SIZE:-128M}
      - --innodb-buffer-pool-instances=8
      - --innodb-flush-method=O_DIRECT
      - --innodb-flush-neighbors=0
      - --innodb-io-capacity=2000
      - --innodb-io-capacity-max=4000
      - --skip-innodb-adaptive-hash-index
